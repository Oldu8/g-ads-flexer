schema: lean

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Monorepo with two independent projects sharing one Postgres (Supabase) database
  as their only integration point — see docs/PLATFORM_ARCHITECTURE.md for the full
  plan before proposing anything cross-cutting.
  - mcp-server/ (Python): the Google Ads MCP server (~100 MCP tools wrapping the
    Google Ads API). Has its own CLAUDE.md — read it before proposing changes here.
  - web/ (Next.js): landing/blog/auth/cabinet, owns the Postgres
    schema/migrations, and is the OAuth authorization server for MCP clients.
  Neither side calls the other's API; they meet at the DB. mcp-server verifies
  web/'s OAuth JWTs with web/'s public JWKS (one MCP URL per ad account).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - "State which side(s) this change touches: mcp-server, web, or both (via the shared DB)."
    - Keep it short (under ~200 words for a typical fix) — skip sections that don't apply.
  tasks:
    - Keep the checklist tight — combine trivial steps, don't pad it out for a small fix.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - Don't pause to ask clarifying questions unless genuinely blocked (missing
        credentials, ambiguous business decision) — make the reasonable call
        yourself and note it in the proposal rather than stopping to ask.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
